name: Deploy naar GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Alleen de publieke bestanden publiceren (geen admin of docs)
      - name: Site samenstellen
        run: |
          mkdir -p slideshow/2011 slideshow/2026
          sh tools/maak-lijsten.sh
          mkdir _site
          cp index.html foto.html slideshow.html style.css app.js slideshow.js \
             people-*.json havo5-*.jpeg _site/
          cp -r slideshow _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
