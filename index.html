<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HAVO 5 · 1986 — Reünie 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <p class="eyebrow">Reünie 2026</p>
    <h1>HAVO 5 <span>·</span> 1986</h1>
    <p class="sub">Beweeg over een gezicht om te zien wie het is.</p>
  </header>

  <main class="layout">
    <section class="stage" id="stage">
      <img id="photo" src="havo5-2026.jpeg" alt="Groepsfoto HAVO 5 klas 1986, reünie 2026">
      <div class="hotspots" id="hotspots"></div>
      <div class="lens" id="lens" aria-hidden="true">
        <div class="lens-img" id="lensImg"></div>
        <div class="lens-name" id="lensName"></div>
      </div>
    </section>

    <aside class="panel">
      <input type="search" id="search" placeholder="Zoek een naam…" aria-label="Zoek een naam">
      <p class="count" id="count"></p>
      <ul id="names" class="names"></ul>
    </aside>
  </main>

  <footer class="foot">Klassenfoto · HAVO 5 · 1986</footer>
  <script src="app.js"></script>
</body>
</html>
